[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Suporte a rotas do React Router (SPA): qualquer caminho que não seja um
# arquivo real ou uma função cai de volta no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
